name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: trystsol
          POSTGRES_PASSWORD: trystsol
          POSTGRES_DB: trystsol
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trystsol -d trystsol"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "ci-secret-key-not-for-production-0123456789"
      ACCESS_TOKEN_SECRET: "ci-access-token-secret-0123456789abcdef"
      DATABASE_URL: "postgres://trystsol:trystsol@127.0.0.1:5432/trystsol"
      REDIS_URL: "redis://127.0.0.1:6379/0"
      PROGRAM_ID: "CThoKseeGQf6wN4jVADhLm549Nw89rsNL8p684iTK8BB"
      SIWS_DOMAIN: "localhost:3000"
      SIWS_URI: "http://localhost:3000"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit
      - name: Checks and tests
        working-directory: apps/api
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python manage.py test apps.accounts apps.chain
      - name: pip-audit
        working-directory: apps/api
        run: pip-audit -r requirements.txt

  program:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.avm
            programs/project_registry/target
          key: anchor-${{ runner.os }}-${{ hashFiles('programs/project_registry/Cargo.lock') }}
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.1.2/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor via AVM
        run: |
          cargo install --git https://github.com/otter-sec/anchor avm --force
          avm install 1.2.2
          avm use 1.2.2
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"
      - name: Build and test
        working-directory: programs/project_registry
        run: |
          anchor build
          cargo test
      - name: cargo audit
        working-directory: programs/project_registry
        run: |
          cargo install cargo-audit --locked
          cargo audit --ignore RUSTSEC-2026-0387 --ignore RUSTSEC-2026-0385

  indexer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/indexer/package-lock.json
      - working-directory: apps/indexer
        run: npm ci
      - working-directory: apps/indexer
        run: npm test
      - working-directory: apps/indexer
        run: npm run build
      - name: npm audit
        working-directory: apps/indexer
        run: npm audit --omit=dev --audit-level=high

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npm run build
      - name: npm audit
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
